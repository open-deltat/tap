name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      # Regression guard for the SDK and shared date logic (bun runs *.test.ts natively).
      - run: bun test
      # The published SDK must stay compilable and must not ship test files in dist.
      - run: cd packages/client && bun run build

  # The SDK hard-codes kernel contracts (multi-row INSERTs, IN-clause reads, predicate-ignoring
  # SELECTs, $N substitution) that only a live server can verify; this job runs the contract
  # suite in packages/client/integration/ against a real deltat.
  integration:
    name: Integration (live deltat)
    runs-on: ubuntu-latest
    env:
      # The published crate is the server the SDK ships against. Tests for newer capabilities
      # (e.g. holds.commit) probe at startup and skip when this version predates them; bump the
      # pin when a new deltat release lands.
      DELTAT_CRATE_VERSION: 0.3.0
      # deltat 0.2.0 generates a random password when DELTAT_PASSWORD is unset, so the
      # server and the suite have to agree on one explicitly. Not a secret: it exists for
      # the length of one job against a loopback-bound server with an empty data dir.
      DELTAT_PASSWORD: ci-integration
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Cache the deltat binary
        id: deltat-bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/deltat
          key: deltat-bin-${{ env.DELTAT_CRATE_VERSION }}-${{ runner.os }}
      - name: Install deltat from crates.io
        if: steps.deltat-bin.outputs.cache-hit != 'true'
        run: cargo install deltat --version "$DELTAT_CRATE_VERSION" --locked
      - name: Start deltat
        run: |
          DELTAT_BIND=127.0.0.1 DELTAT_DATA_DIR="$RUNNER_TEMP/deltat-data" \
          DELTAT_PASSWORD="$DELTAT_PASSWORD" \
            deltat > "$RUNNER_TEMP/deltat.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/deltat.pid"
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/5433) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "deltat never opened port 5433"
          cat "$RUNNER_TEMP/deltat.log"
          exit 1
      - name: Run the live-server contract suite
        run: |
          DELTAT_INTEGRATION_PORT=5433 \
          DELTAT_INTEGRATION_PASSWORD="$DELTAT_PASSWORD" \
            bun test packages/client/integration/
      - name: Print the server log
        if: failure()
        run: cat "$RUNNER_TEMP/deltat.log"
      - name: Stop deltat
        if: always()
        run: test -f "$RUNNER_TEMP/deltat.pid" && kill "$(cat "$RUNNER_TEMP/deltat.pid")" || true
