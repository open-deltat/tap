# TAP API - Self-contained with embedded SQLite
# No external database required!
#
# Usage:
#   docker compose up -d        # Start
#   docker compose logs -f      # View logs
#   docker compose down         # Stop
#
# Data persists in the tap-data volume

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tap-api
    ports:
      - "3000:3000"
    volumes:
      - tap-data:/app/data
    environment:
      - TAP_DB_PATH=/app/data/tap.sqlite
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  tap-data:
    name: tap-data
