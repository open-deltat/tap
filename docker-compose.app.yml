# TAP App - Next.js Frontend
#
# Usage:
#   docker compose -f docker-compose.app.yml up -d
#
# Requires TAP_API_URL environment variable pointing to your API

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    expose:
      - "3001"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${TAP_API_URL:-http://localhost:3000}
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.app.loadbalancer.server.port=3001"

networks:
  coolify:
    external: true

