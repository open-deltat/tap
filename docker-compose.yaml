# Deploy the deltat database + the examples app together from this one repo.
#
#   DELTAT_PASSWORD=<choose-a-secret> docker compose up --build -d   ->  http://localhost:3000
#
# deltat is public, so it builds straight from its Git URL (no sibling checkout needed). The demo
# is a bun-workspace member, so its build context is this repo root. Only the demo's port 3000 is
# published; it reaches deltat over the internal compose network via pgwire.
services:
  deltat:
    build: https://github.com/open-deltat/deltat.git#main
    restart: unless-stopped
    environment:
      DELTAT_PASSWORD: ${DELTAT_PASSWORD:-deltat}
      DELTAT_BIND: 0.0.0.0
    volumes:
      - deltat-data:/data # WAL persistence; remove this line for a fully ephemeral demo

  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    restart: unless-stopped
    environment:
      DELTAT_HOST: deltat
      DELTAT_PORT: "5433"
      # Two tenants on one deltat: the curated demos we seed, and the bookables strangers create
      # through /new. Separate engines, separate WALs, so public traffic cannot slow or bloat the
      # demos.
      DELTAT_DB: demo
      DELTAT_PUBLIC_DB: public
      DELTAT_PASSWORD: ${DELTAT_PASSWORD:-deltat}
      PORT: "3000"
      # Sign-in (any OIDC issuer; blank leaves the site anonymous-only). Signed-in owners get
      # calendars, and visitors can send meeting requests. See packages/examples/src/lib/auth-session.ts.
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      AUTH_AUTHORIZE_URL: ${AUTH_AUTHORIZE_URL:-}
      AUTH_TOKEN_URL: ${AUTH_TOKEN_URL:-}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:-}
      AUTH_USERINFO_URL: ${AUTH_USERINFO_URL:-}
      AUTH_TRUSTED_ISSUERS: ${AUTH_TRUSTED_ISSUERS:-}
      AUTH_PROVIDER_PARAM: ${AUTH_PROVIDER_PARAM:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_MCP_AUDIENCE: ${AUTH_MCP_AUDIENCE:-}
      # The public origin, e.g. https://delt.at. Needed for the hosted MCP endpoint (/mcp) and the
      # review link in owner notifications; /mcp stays off without it.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Optional: an https Slack or Discord incoming-webhook URL that hears about each new meeting request.
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
    ports:
      - "3000:3000"
    volumes:
      # Ownership of a public bookable lives in a file here, not in deltat (NOT-02 keeps identity
      # out of the kernel). Without this volume every redeploy would strand every bookable people
      # created: the resource survives in the WAL, the key that manages it does not. The same
      # volume also persists the demos' app-level resource metadata and the meeting requests.
      #
      # This is what pins the app to ONE replica. A second container would keep its own copy of the
      # registry and the two would overwrite each other. Scaling out means moving the registry to a
      # shared store first.
      - demo-data:/app/demo/data
    depends_on:
      - deltat

volumes:
  deltat-data: {}
  demo-data: {}
