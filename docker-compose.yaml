# Deploy the deltat database + the examples app together from this one repo.
#
#   DELTAT_PASSWORD=<choose-a-secret> docker compose up --build -d   ->  http://localhost:3000
#
# deltat is public, so it builds straight from its Git URL (no sibling checkout needed). The demo
# is a bun-workspace member, so its build context is this repo root. Only the demo's port 3000 is
# published; it reaches deltat over the internal compose network via pgwire.
services:
  deltat:
    build: https://github.com/open-tap/deltat.git#main
    restart: unless-stopped
    environment:
      DELTAT_PASSWORD: ${DELTAT_PASSWORD:?set DELTAT_PASSWORD}
      DELTAT_BIND: 0.0.0.0
    volumes:
      - deltat-data:/data # WAL persistence; remove this line for a fully ephemeral demo

  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    restart: unless-stopped
    environment:
      DELTAT_HOST: deltat
      DELTAT_PORT: "5433"
      DELTAT_DB: demo
      DELTAT_PASSWORD: ${DELTAT_PASSWORD:?set DELTAT_PASSWORD}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - deltat

volumes:
  deltat-data: {}
